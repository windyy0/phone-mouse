[package]
name = "phone-mouse-server"
version = "1.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "=0.8.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
local-ip-address = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }

[target.'cfg(windows)'.dependencies]
base64 = "0.22.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
windows = { version = "0.61.3", features = ["Win32_NetworkManagement_WindowsFirewall", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_System_Threading"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tao = { version = "0.34.6", default-features = false }
tray-icon = { version = "0.24.2", default-features = false }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[dev-dependencies]
tokio-tungstenite = "0.28"
futures-util = "0.3"

[build-dependencies]
winres = "0.1"
